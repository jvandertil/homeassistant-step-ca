---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: Lint shell scripts
        run: shellcheck step-ca-client/rootfs/usr/bin/*.sh

      - name: Lint YAML
        run: yamllint .

      - name: Build the add-on image
        run: docker build --pull=false step-ca-client
