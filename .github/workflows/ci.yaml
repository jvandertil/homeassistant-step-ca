---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Lint shell scripts
        run: shellcheck step-ca-client/rootfs/usr/bin/*.sh

      - name: Lint YAML
        run: yamllint .

      - name: Build the add-on image
        run: docker build --pull=false step-ca-client
