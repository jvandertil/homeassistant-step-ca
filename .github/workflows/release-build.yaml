---
name: Release build

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Build the release image
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          docker build \
            --pull=false \
            --build-arg BUILD_REPOSITORY="${{ github.repository }}" \
            --build-arg BUILD_VERSION="$RELEASE_VERSION" \
            --tag step-ca-client:"$RELEASE_VERSION" \
            step-ca-client
