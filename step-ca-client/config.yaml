---
name: step-ca-client
version: 0.2.0-beta.1
slug: step-ca-client
description: SSL/TLS certificates from your own PKI
url: https://github.com/jvandertil/homeassistant-step-ca
image: ghcr.io/jvandertil/ha-step-ca-client
stage: experimental
init: false
auth_api: true
hassio_api: true
hassio_role: manager
map:
  - ssl:rw
arch:
  - aarch64
  - amd64
options:
  ca_url: https://tinyca.internal
  root_ca_fingerprint: ""
  token: ""
  subjects:
    - homeassistant.local
  cafile: ca.pem
  keyfile: privkey.pem
  certfile: fullchain.pem
  renewal_method: renew
  retry_backoff_seconds: 60
  renewal_check_interval_seconds: 3600
  restart_ha: true
  restart_addons:
    - core_mosquitto
  log_level: info
  key_type: RSA
  mqtt:
    enabled: false
    instance_id: ""
    host: ""
    port: 1883
    username: ""
    password: ""
    tls: false
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
  client_certificate:
    enabled: false
    ca_url: ""
    root_ca_fingerprint: ""
    token: ""
    subject: ""
    sans: []
    cafile: client-ca.pem
    keyfile: client-privkey.pem
    certfile: client-fullchain.pem
    key_type: RSA
    renewal_method: renew
    restart_ha: false
    restart_addons: []
schema:
  ca_url: url
  root_ca_fingerprint: str
  token: password
  subjects:
    - str
  cafile: str
  keyfile: str
  certfile: str
  renewal_method: list(renew|rekey)
  retry_backoff_seconds: int(1,3600)
  renewal_check_interval_seconds: int(1,86400)
  restart_ha: bool
  restart_addons:
    - str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  key_type: list(EC|OKP|RSA)
  mqtt:
    enabled: bool
    instance_id: str
    host: str
    port: int(1,65535)
    username: str?
    password: password
    tls: bool
    ca_file: str?
    client_cert_file: str?
    client_key_file: str?
  client_certificate:
    enabled: bool
    ca_url: str?
    root_ca_fingerprint: str?
    token: password
    subject: str
    sans:
      - str
    cafile: str
    keyfile: str
    certfile: str
    key_type: list(EC|OKP|RSA)
    renewal_method: list(renew|rekey)
    restart_ha: bool
    restart_addons:
      - str
