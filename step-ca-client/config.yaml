---
name: step-ca-client
version: 0.1.0-beta.2
slug: step-ca-client
description: SSL/TLS certificates from your own PKI
url: https://github.com/jvandertil/homeassistant-step-ca
image: ghcr.io/jvandertil/ha-step-ca-client
stage: experimental
init: false
auth_api: true
hassio_api: true
hassio_role: manager
map:
  - ssl:rw
arch:
  - aarch64
  - amd64
options:
  ca_url: https://tinyca.internal
  root_ca_fingerprint: ""
  token: ""
  subjects:
    - homeassistant.local
  cafile: ca.pem
  keyfile: privkey.pem
  certfile: fullchain.pem
  renewal_method: renew
  retry_backoff_seconds: 60
  restart_ha: true
  restart_addons:
    - core_mosquitto
  log_level: info
  key_type: RSA
schema:
  ca_url: url
  root_ca_fingerprint: str
  token: password
  subjects:
    - str
  cafile: str
  keyfile: str
  certfile: str
  renewal_method: list(renew|rekey)
  retry_backoff_seconds: int(1,3600)
  restart_ha: bool
  restart_addons:
    - str
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  key_type: list(EC|OKP|RSA)
