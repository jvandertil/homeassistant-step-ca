---
configuration:
  ca_url:
    name: step-ca Server URL
    description: >-
      URL of the targeted Step Certificate Authority.
  root_ca_fingerprint:
    name: step-ca Root CA fingerprint
    description: >-
      Fingerprint of the root certificate.
  token:
    name: step-ca One-time Token
    description: >-
      Generate a token with `step ca token`.
  subjects:
    name: Subjective Alternative Names (SANs) to include in the certificate request
    description: >-
      Use YAML configuration mode. Add domain names or IP Address as
      Subjective Alternative Names (SANs) to the certificate.
  cafile:
    name: Root CA cert filename
    description: >-
      Path to where the root CA certificates will be stored, relative to /ssl/.
  keyfile:
    name: Private key filename
    description: >-
      Path to where the private key file will be created, relative to /ssl/.
  certfile:
    name: Certificate filename
    description: >-
      Path to where the certificate file will be created, relative to /ssl/.
  renewal_method:
    name: Certificate renewal method
    description: >-
      Choose renew to retain the existing private key, or rekey to generate a
      new private key with each certificate update. Restart the add-on after
      changing this option.
  renewal_threshold:
    name: Certificate renewal threshold
    description: >-
      Percentage of lifetime elapsed (such as 66%) or time before expiry
      (such as 24h). Default: 66%. Restart the app after changing this option.
      Restore 66% after a temporary early renewal.
  retry_backoff_seconds:
    name: Renewal retry delay
    description: >-
      Seconds to wait before retrying a failed due renewal. The default is 60 seconds.
  renewal_check_interval_seconds:
    name: Renewal check interval
    description: Seconds between healthy certificate checks. The default is 15 minutes (900).
  mqtt:
    name: MQTT certificate telemetry
    description: Optional discovery and status publishing to your MQTT broker.
    fields:
      enabled:
        name: Enable MQTT telemetry
      instance_id:
        name: Instance ID
        description: Unique letters, digits, underscores, or hyphens for this installation.
      host:
        name: Broker hostname
      port:
        name: Broker port
      username:
        name: Broker username
      password:
        name: Broker password
      tls:
        name: Verify broker TLS
      ca_file:
        name: Broker CA filename
        description: Optional PEM filename relative to /ssl.
      client_cert_file:
        name: Broker client certificate filename
        description: Optional mTLS PEM filename relative to /ssl.
      client_key_file:
        name: Broker client key filename
        description: Optional mTLS private key filename relative to /ssl.
  restart_ha:
    name: Restart Home Assistant core on certificate renewal
  restart_addons:
    name: Apps to restart on certificate renewal
    description: >-
      Use YAML configuration mode. List of installed app IDs to restart when a certificate is renewed.
  log_level:
    name: Log level
    description: The amount of logging the add-on should do.
  key_type:
    name: Key type used for the certificate
  client_certificate:
    name: Optional client certificate
    description: >-
      An optional shared mTLS client identity. When disabled, no client key or certificate is created.
    fields:
      enabled:
        name: Enable client certificate
      ca_url:
        name: Client step-ca Server URL
        description: Leave blank to use the server certificate authority.
      root_ca_fingerprint:
        name: Client Root CA fingerprint
        description: Leave blank to use the server certificate authority fingerprint.
      token:
        name: Client one-time token
      subject:
        name: Client certificate subject
      sans:
        name: Client certificate SANs
        description: Use YAML configuration mode to list SANs included in the token and certificate request.
      cafile:
        name: Client Root CA certificate filename
      keyfile:
        name: Client private key filename
      certfile:
        name: Client certificate filename
      key_type:
        name: Client key type
      renewal_method:
        name: Client renewal method
      renewal_threshold:
        name: Client certificate renewal threshold
        description: >-
          Percentage of lifetime elapsed (such as 66%) or time before expiry
          (such as 24h). Default: 66%. Restart the app after changing this option.
      restart_ha:
        name: Restart Home Assistant core after client certificate renewal
      restart_addons:
        name: Apps to restart after client certificate renewal
